name: Release

# Bump VERSION on main and this tags the commit, publishes a GitHub release with that version's notes
# from templates/shelflife.xml <Changes>, and builds the versioned image.
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.create.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Create the release if it doesn't exist yet
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          tag="v${version}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "VERSION must look like 1.2.3, got '$version'"; exit 1; fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already released; nothing to do"
            exit 0
          fi
          # Notes: the "### <version> (...)" section of the template's <Changes>
          awk -v v="### ${version} " '
            index($0, v) == 1 { on = 1; next }
            on && (/^### / || /<\/Changes>/) { exit }
            on { print }
          ' templates/shelflife.xml | sed '/^[[:space:]]*$/d' > notes.md
          [ -s notes.md ] || echo "Shelflife ${tag}" > notes.md
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  image:
    needs: release
    if: needs.release.outputs.tag != ''
    uses: ./.github/workflows/docker.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    permissions:
      contents: read
      packages: write
