<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b2129">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex">
  <title>Sign in · Shelflife</title>
  <link rel="icon" type="image/png" href="/static/icon-192.png">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preload" href="/static/fonts/plex-sans-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/app.css?v={{v}}">
  <style>
    body { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; }
    .stage { width: min(400px, 100%); display: flex; flex-direction: column; align-items: center; }

    .mark { width: 168px; height: 120px; overflow: visible; }
    .mark .book { transform-box: fill-box; transform-origin: 50% 100%; }
    .mark .tilt { transform-box: fill-box; transform-origin: 0% 100%; transform: rotate(12deg); }
    .wordmark { font: 600 34px/1 "Plex Condensed", "Plex", sans-serif; margin: 18px 0 6px; letter-spacing: .005em; }
    .lede { margin: 0 0 26px; color: var(--muted); text-align: center; }

    .card { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px 24px 22px; }
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .field label { font-size: 13.5px; color: var(--muted); }
    .field input {
      box-sizing: border-box; width: 100%; height: 46px; min-height: 0; margin: 0;
      padding: 0 12px; font-size: 16px; line-height: 1.2;
      background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius-s);
      -webkit-appearance: none; appearance: none;
    }
    /* focus is drawn inside the box so the focused field never looks bigger than the other */
    .field input:focus-visible, .field input:focus {
      outline: none; border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent);
    }
    .pw { position: relative; }
    .pw input { padding-right: 46px; }
    .pw input::-ms-reveal { display: none; }
    .pw input::-webkit-credentials-auto-fill-button { visibility: hidden; position: absolute; right: 0; }
    .pw button {
      position: absolute; top: 1px; right: 1px; bottom: 1px; width: 44px;
      display: grid; place-items: center;
      background: none; border: 0; border-radius: 0 var(--radius-s) var(--radius-s) 0;
      color: var(--muted); cursor: pointer; padding: 0;
    }
    .pw button:hover { color: var(--text); }
    .pw button:focus-visible { outline: none; color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); }
    .pw .eye-off { display: none; }
    .pw button[aria-pressed="true"] .eye { display: none; }
    .pw button[aria-pressed="true"] .eye-off { display: block; }
    .remember { margin: 2px 0 20px; font-size: 14px; }
    .submit { width: 100%; min-height: 46px; font-size: 15.5px; }
    .error { min-height: 1.4em; margin: 14px 0 0; color: var(--danger); font-size: 14px; text-align: center; }
    .error:empty { margin: 0; min-height: 0; }

    @keyframes drop { from { transform: translateY(-46px); opacity: 0; } 70% { opacity: 1; } to { transform: none; opacity: 1; } }
    @keyframes lean { from { transform: rotate(0); } to { transform: rotate(12deg); } }
    .mark .book { animation: drop .5s cubic-bezier(.3, 1.4, .5, 1) both; }
    .mark .b2 { animation-delay: .08s; } .mark .b3 { animation-delay: .16s; } .mark .b4 { animation-delay: .24s; }
    .mark .tilt { animation: lean .45s .7s cubic-bezier(.5, 0, .3, 1.3) both; }
    @media (prefers-reduced-motion: reduce) { .mark .book, .mark .tilt { animation: none; } }
  </style>
</head>
<body>
  <main class="stage">
    <svg class="mark" viewBox="0 0 168 120" aria-hidden="true">
      <rect class="book b1" x="10" y="20" width="26" height="92" rx="5" fill="#7db79a"/>
      <rect class="book b2" x="42" y="4" width="30" height="108" rx="5" fill="#a9b680"/>
      <rect class="book b3" x="78" y="30" width="24" height="82" rx="5" fill="#d4b467"/>
      <g class="tilt"><rect class="book b4" x="118" y="6" width="28" height="106" rx="5" fill="#a48ed0"/></g>
      <rect x="0" y="110" width="168" height="10" rx="5" fill="#e4e8ee"/>
    </svg>
    <h1 class="wordmark">Shelflife</h1>
    <p class="lede">Sign in to manage your Plex libraries.</p>

    <form class="card" id="form" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="pw">
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <button type="button" id="reveal" aria-controls="password" aria-pressed="false" aria-label="Show password" title="Show password">
            <svg class="eye" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
            <svg class="eye-off" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a17.7 17.7 0 0 1-3.1 4.1M6.6 6.6C3.7 8.5 2 12 2 12s3.6 7 10 7a9.8 9.8 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2M3 3l18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
      <label class="check remember"><input type="checkbox" id="remember" checked> Keep me signed in for 30 days</label>
      <button class="btn submit" id="submit" type="submit">Sign in</button>
      <p class="error" id="error" role="alert" aria-live="assertive"></p>
    </form>
  </main>

  <script>
    (function () {
      const form = document.getElementById("form");
      const user = document.getElementById("username");
      const pass = document.getElementById("password");
      const err = document.getElementById("error");
      const btn = document.getElementById("submit");
      const reveal = document.getElementById("reveal");

      // Only ever send people back to a path on this site.
      const next = new URLSearchParams(location.search).get("next") || "/";
      const dest = /^\/(?!\/)/.test(next) && !next.startsWith("/login") ? next : "/";

      user.focus();
      reveal.addEventListener("click", () => {
        const show = pass.type === "password";
        pass.type = show ? "text" : "password";
        reveal.setAttribute("aria-pressed", String(show));
        reveal.setAttribute("aria-label", show ? "Hide password" : "Show password");
        reveal.title = show ? "Hide password" : "Show password";
        pass.focus();
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        if (!user.value.trim()) { err.textContent = "Enter your username."; user.focus(); return; }
        if (!pass.value) { err.textContent = "Enter your password."; pass.focus(); return; }
        err.textContent = "";
        btn.disabled = true;
        btn.textContent = "Signing in…";
        try {
          const r = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: user.value.trim(), password: pass.value, remember: document.getElementById("remember").checked }),
          });
          if (r.ok) { location.replace(dest); return; }
          let msg = "Couldn't sign in.";
          try { msg = (await r.json()).detail || msg; } catch (_) { /* not json */ }
          err.textContent = msg;
          pass.value = "";
          pass.focus();
        } catch (_) {
          err.textContent = "Couldn't reach Shelflife. Check your connection and try again.";
        }
        btn.disabled = false;
        btn.textContent = "Sign in";
      });
    })();
  </script>
</body>
</html>
